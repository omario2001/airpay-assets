<svg width="1012" height="638" viewBox="0 0 1012 638" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', Inter, system-ui, sans-serif">
  <defs>
    <!-- flat matte card face, subtle top sheen only -->
    <linearGradient id="face" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1a1c22"/>
      <stop offset="0.5" stop-color="#111318"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6e24b"/>
      <stop offset="1" stop-color="#87ca2d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d9a0"/>
      <stop offset="0.5" stop-color="#c9b063"/>
      <stop offset="1" stop-color="#9c8442"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="1012" height="638" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- body -->
    <rect x="0" y="0" width="1012" height="638" rx="56" fill="url(#face)"/>
    <rect x="0" y="0" width="1012" height="638" rx="56" fill="url(#sheen)"/>
    <!-- faint hairline border -->
    <rect x="1.5" y="1.5" width="1009" height="635" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

    <!-- soft lime glow arc bottom-right (brand accent, not metal) -->
    <circle cx="1080" cy="720" r="360" fill="url(#lime)" opacity="0.14"/>

    <!-- brand: chevron mark + AirPay wordmark, top-left -->
    <g transform="translate(72,58)">
      <!-- exact AirPay coin mark, in white -->
