        <path d="M176.289 155.368C177.232 155.466 179.065 155.755 179.805 156.287C184.433 159.612 189.952 165.073 194.098 168.949L209.476 183.077L240.724 212.054C247.273 218.004 253.772 224.008 260.22 230.065C262.653 232.33 269.473 237.927 270.317 240.398C272.468 246.697 259.402 245.203 257.038 245.178C252.992 245.129 248.946 245.126 244.899 245.17C240.059 245.194 225.492 245.697 221.101 244.492C219.587 244.077 212.073 236.54 210.214 234.787L188.185 213.694C186.286 211.886 181.337 206.926 179.374 205.794L179.273 205.736C177.72 205.35 175.188 205.074 173.849 206.077C170.605 208.506 167.622 211.948 164.774 214.824L145.309 234.259C142.972 236.586 137.463 242.349 135.13 244.148L134.975 244.266C133.338 245.527 125.027 245.187 122.774 245.188L107.408 245.183C103.312 245.179 89.3082 245.726 86.1815 244.113C83.7523 240.468 86.7512 237.869 89.255 235.381C97.6544 227.034 106.355 219.014 114.892 210.815L154.527 173.11L164.794 163.405C168.223 160.143 171.464 156.034 176.289 155.368Z"/>
      </svg>
      <text x="86" y="48" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#ffffff">AirPay</text>
    </g>

    <!-- EMV chip -->
    <g transform="translate(80,236)">
      <rect x="0" y="0" width="104" height="80" rx="14" fill="url(#chip)"/>
      <rect x="0" y="0" width="104" height="80" rx="14" fill="none" stroke="#7a6631" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M35 0 V80 M69 0 V80 M0 27 H104 M0 53 H104" stroke="#7a6631" stroke-opacity="0.55" stroke-width="2.5"/>
    </g>
    <!-- contactless -->
    <g transform="translate(214,244)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M4 10 a26 26 0 0 1 0 44"/>
      <path d="M20 2 a40 40 0 0 1 0 60"/>
    </g>

    <!-- card number -->
    <text x="80" y="452" font-size="46" font-weight="500" letter-spacing="6" fill="#ffffff" fill-opacity="0.92">4128  ••••  ••••  8207</text>

    <!-- name + valid -->
    <text x="80" y="540" font-size="30" font-weight="600" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.88">OMAR SHENTO</text>
    <text x="80" y="580" font-size="20" font-weight="500" letter-spacing="1" fill="#ffffff" fill-opacity="0.5">VALID THRU  08/29</text>

    <!-- DEBIT tag -->
    <text x="80" y="200" font-size="20" font-weight="600" letter-spacing="3" fill="#87ca2d">DEBIT</text>

    <!-- network mark bottom-right (interlocking discs) -->
    <g transform="translate(848,486)">
      <circle cx="40" cy="52" r="52" fill="#87ca2d" fill-opacity="0.9"/>
      <circle cx="104" cy="52" r="52" fill="#ffffff" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
